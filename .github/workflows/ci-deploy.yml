name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome checks
        run: npm run biome:ci

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build web
        run: npm run build --workspace=apps/web

      - name: Verification summary
        run: |
          {
            echo "## Verification"
            echo "- Dependencies installed with \`npm ci\`"
            echo "- Biome checks passed"
            echo "- API build passed"
            echo "- Web build passed"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: Deploy API to Vercel
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel API secrets
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_API_PROJECT_ID" && exit 1)

      - name: Pull API Vercel environment
        working-directory: apps/api
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build API with Vercel
        working-directory: apps/api
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy API prebuilt output
        id: deploy-api
        working-directory: apps/api
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "API deployed to $url"

      - name: API deployment summary
        run: |
          {
            echo "## API Deployment"
            echo "- Project secret: \`VERCEL_API_PROJECT_ID\`"
            echo "- Deployment URL: ${{ steps.deploy-api.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    needs:
      - verify
      - deploy-api
    if: github.event_name != 'pull_request'
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel web secrets
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "Missing VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_ORG_ID" || (echo "Missing VERCEL_ORG_ID" && exit 1)
          test -n "$VERCEL_PROJECT_ID" || (echo "Missing VERCEL_WEB_PROJECT_ID" && exit 1)

      - name: Pull web Vercel environment
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build web with Vercel
        working-directory: apps/web
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy web prebuilt output
        id: deploy-web
        working-directory: apps/web
        run: |
          url="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Web deployed to $url"

      - name: Web deployment summary
        run: |
          {
            echo "## Web Deployment"
            echo "- Project secret: \`VERCEL_WEB_PROJECT_ID\`"
            echo "- Deployment URL: ${{ steps.deploy-web.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
